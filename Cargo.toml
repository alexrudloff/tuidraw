[package]
name = "ratatui-json"
version = "0.1.0"
edition = "2024"
description = "TUI Draw: a conversational terminal application builder"
license = "MIT"

[[bin]]
name = "tui-draw"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-widgets = { version = "0.7.11", default-features = false, features = ["bar-graph", "big-text", "box-text", "cards", "equalizer", "popup", "qrcode", "scrollview"] }
qrcode = { version = "0.14", default-features = false }
ansi-to-tui = "8.0.1"
getrandom = "0.3.4"
